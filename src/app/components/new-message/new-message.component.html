<div
  class="w-full max-w-xl rounded-md border border-cream/10 bg-surface-container-high/90 p-6 text-on-surface backdrop-blur-[30px]"
>
  <!-- Top App Bar -->
  <header class="-mx-6 -mt-6 mb-4 border-b border-on-surface/10 bg-surface/80 backdrop-blur-xl">
    <div class="flex h-16 items-center justify-between px-4 gap-3">
      <div class="flex items-center gap-4">
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-secondary-container">
          <mat-icon class="text-primary">mark_email_unread</mat-icon>
        </div>
        <span class="text-xl font-extrabold text-primary">{{ title }}</span>
      </div>
      <button
        mat-icon-button
        aria-label="Close"
        class="!flex text-primary hover:opacity-80 active:scale-95"
        (click)="closeDialog()"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </header>

  <!-- Message Body -->
  <div class="mb-4 whitespace-pre-wrap text-sm text-on-surface-variant">
    {{ body }}
  </div>

  <!-- Date -->
  <div class="mb-6 text-xs tracking-[0.05em] text-on-surface-variant">
    Received: {{ date | date: "YYYY-MM-dd HH:mm" }}
  </div>

  <!-- Action -->
  <div class="text-right">
    <button
      mat-raised-button
      color="primary"
      class="rounded-xl px-6 py-2"
      (click)="closeDialog()"
    >
      OK
    </button>
  </div>
</div>
